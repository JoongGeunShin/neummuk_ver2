name: neummuk_ver2
description: "2026 관광데이터 활용 공모전 - 내움먹 (내가 움직이는 이유는 먹기 위해서다)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0
  firebase_auth: ^5.3.0
  firebase_storage: ^12.3.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Location & activity
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  pedometer: ^4.2.0
  flutter_foreground_task: ^8.14.0

  # Geo query
  geoflutterfire_plus: ^0.0.26

  # Map
  flutter_naver_map: ^1.3.0
  flutter_compass: ^0.8.0

  # HTTP
  http: ^1.2.1
  url_launcher: ^6.3.0

  # Image
  cached_network_image: ^3.4.1

  # Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Icon & splash generators
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# ── App icon generator config ──────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#1A1A1E"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: false

# ── Native splash config (shown before Flutter loads) ──────
# 이미지 없이 배경색만 → GIF 스플래시와 색이 동일해 전환이 끊김 없이 이어짐
flutter_native_splash:
  color: "#1A1A1E"
  color_dark: "#1A1A1E"
  android_12:
    color: "#1A1A1E"
    icon_background_color: "#1A1A1E"
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardGOV-Thin.ttf
          weight: 100
        - asset: assets/fonts/PretendardGOV-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/PretendardGOV-Light.ttf
          weight: 300
        - asset: assets/fonts/PretendardGOV-Regular.ttf
          weight: 400
        - asset: assets/fonts/PretendardGOV-Medium.ttf
          weight: 500
        - asset: assets/fonts/PretendardGOV-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PretendardGOV-Bold.ttf
          weight: 700
        - asset: assets/fonts/PretendardGOV-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PretendardGOV-Black.ttf
          weight: 900
